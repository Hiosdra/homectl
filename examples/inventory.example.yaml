version: 1
session:
  ttl: 24h
  database: /home/operator/.config/homectl/homelab.kdbx
machines:
  agent-host:
    description: Local machine running Codex or Claude Code
    transport: local
    access: user
    enforcement: advisory
  lab-printer:
    description: Example Klipper printer
    transport: ssh
    ssh_alias: lab-printer
    address: 192.0.2.10
    user: pi
    access: sudo-approved
    enforcement: sudoers
    auth:
      type: keepassxc
      entry: homectl-lab-printer
      socket: /home/operator/.config/homectl/inventory.yaml.session/agent.sock
      public_key: /home/operator/.config/homectl/public-keys/lab-printer.pub
    caution:
    - Check printer is idle before restarting Klipper
    sudo_allow:
    - - /usr/bin/systemctl
      - restart
      - klipper
    - - /usr/bin/systemctl
      - restart
      - moonraker
  lab-nas:
    description: Example critical NAS
    transport: ssh
    ssh_alias: lab-nas
    address: 192.0.2.11
    user: operator
    access: observe
    enforcement: advisory
    auth:
      type: keepassxc
      entry: homectl-lab-nas
      socket: /home/operator/.config/homectl/inventory.yaml.session/agent.sock
      public_key: /home/operator/.config/homectl/public-keys/lab-nas.pub
    caution:
    - Storage changes may affect other workloads
  lab-proxmox:
    description: Example Proxmox SSH node
    transport: ssh
    ssh_alias: lab-proxmox
    address: 192.0.2.12
    user: root
    access: full
    enforcement: advisory
    auth:
      type: keepassxc
      entry: homectl-lab-proxmox
      socket: /home/operator/.config/homectl/inventory.yaml.session/agent.sock
      public_key: /home/operator/.config/homectl/public-keys/lab-proxmox.pub
providers:
  lab-pve:
    type: proxmox
    host: lab-proxmox
    node: pve
