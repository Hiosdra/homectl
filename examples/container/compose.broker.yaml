# UGOS Docker Compose Project for the homectl 0.3 broker. Example only: this
# repository does not deploy it. Import it in UGOS as a Project, after building
# or verifying the image yourself (see docs/setup.md, Docker and NAS containers).
#
# Set values in the project's .env file, never in this YAML:
#   HOMECTL_IMAGE              the broker image reference you built or verified,
#                              for example homectl-broker:0.3-local
#   HOMECTL_PANEL_ORIGIN       REQUIRED. The exact browser origin of the owner panel,
#                              for example https://homectl.lan.example.test. The
#                              example name is a placeholder: use your own origin.
#   HOMECTL_PANEL_PUBLISH      optional; host address:port the panel is published on.
#                              Default 127.0.0.1:7451 (loopback on the NAS only).
#   HOMECTL_WORKSPACE_LISTEN   optional; the workspace listener address inside the
#                              container, for example 0.0.0.0:7450 on the NAS that is
#                              the workspace server. Leave unset for a client.
#   HOMECTL_WORKSPACE_PUBLISH  optional; host address:port for the workspace port.
#                              Default 127.0.0.1:7450. Reaches something only when
#                              HOMECTL_WORKSPACE_LISTEN is set.
#   HOMECTL_PANEL_INSECURE_HTTP  leave unset. Set to 1 only for the SSH-tunnel
#                              route below, after you accept its trade-off.
#
# What runs: the image entrypoint starts `daemon run` (the broker) and
# `daemon panel` (the owner panel) side by side. State lives in the private
# named volume homectl-state, mounted at /data. No secret is in this file, and
# the owner password is set inside the container (see docs/setup.md).
#
# Network: a bridge network, so Docker can publish the panel port. Inside the
# container the panel listens on 0.0.0.0 (HOMECTL_PANEL_LISTEN), which is not
# loopback, so it needs HOMECTL_PANEL_ORIGIN and refuses plain http. Two
# supported ways to reach it:
#   1. An https reverse proxy you run, forwarding to HOMECTL_PANEL_PUBLISH.
#      Set HOMECTL_PANEL_ORIGIN to the https origin your browser opens. The proxy
#      must pass the Host and Origin headers through unchanged.
#   2. An SSH tunnel from your computer, `ssh -L 7451:127.0.0.1:7451 <nas>`. SSH encrypts
#      the traffic, but the panel sees plain http, so set
#      HOMECTL_PANEL_ORIGIN=http://127.0.0.1:7451 and HOMECTL_PANEL_INSECURE_HTTP=1.
#      The panel cannot tell that the tunnel is encrypted, so the opt-in is yours.
# Bridge networking under UGOS is not verified by this repository.
name: homectl-broker

services:
  homectl:
    image: ${HOMECTL_IMAGE:?set HOMECTL_IMAGE to the broker image you built or verified}
    container_name: homectl-broker
    networks:
      - homectl
    ports:
      - "${HOMECTL_PANEL_PUBLISH:-127.0.0.1:7451}:7451"
      - "${HOMECTL_WORKSPACE_PUBLISH:-127.0.0.1:7450}:7450"
    init: true
    user: "10001:10001"
    privileged: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    volumes:
      # The only writable path: inventory, broker state and backups (UID 10001).
      - homectl-state:/data
    environment:
      # The panel listens on every address inside the container; the published
      # port above decides who can reach it.
      HOMECTL_PANEL_LISTEN: "0.0.0.0"
      # Required: the broker and the panel both use this exact origin. Compose
      # stops with the message below when it is not set in .env.
      HOMECTL_PANEL_ORIGIN: ${HOMECTL_PANEL_ORIGIN:?set HOMECTL_PANEL_ORIGIN in .env to the exact browser origin, for example https://homectl.lan.example.test}
      # Empty unless you chose the SSH-tunnel route (plain http) in the header.
      HOMECTL_PANEL_INSECURE_HTTP: ${HOMECTL_PANEL_INSECURE_HTTP:-}
      HOMECTL_OWNER_PANEL_PORT: "7451"
      # Empty means client only. Inside the container use 0.0.0.0:7450 on the NAS
      # that is the workspace server.
      HOMECTL_WORKSPACE_LISTEN: ${HOMECTL_WORKSPACE_LISTEN:-}
    healthcheck:
      test: ["CMD", "bun", "/app/docker/healthcheck.ts"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  homectl:
    driver: bridge

volumes:
  homectl-state:
