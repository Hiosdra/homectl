# Linux packages for homectl, built by scripts/build-packages.ts with nfpm.
# Placeholders are filled in per target by scripts/build-packages.ts (nfpm does not expand them):
#   @VERSION@  the package version (package.json)
#   @ARCH@     amd64 or arm64 (nfpm maps it to each packager name)
#   @BINARY@   the compiled executable to install as /usr/bin/home-ctl
# Run from the repository root, so the LICENSE path resolves.
name: homectl
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
section: utils
priority: optional
maintainer: "Hiosdra <https://github.com/Hiosdra>"
description: |
  homectl: a local control plane for homelab machines.
  It runs approvals, peer sync and the local web panel. The binary is self-contained.
vendor: "Hiosdra"
homepage: "https://github.com/Hiosdra/homectl"
license: "MIT"
contents:
  - src: "@BINARY@"
    dst: /usr/bin/home-ctl
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/homectl/LICENSE
    file_info:
      mode: 0644
# Built by scripts/build-packages.ts: deb and rpm for glibc, archlinux (pacman) for Arch, apk for musl.
overrides:
  # ssh is needed for machines; keepassxc-cli unlocks the vault. Package names differ per distribution.
  deb:
    depends:
      - openssh-client
    recommends:
      - keepassxc
  rpm:
    depends:
      - openssh-clients
    recommends:
      - keepassxc
  archlinux:
    depends:
      - openssh
    recommends:
      - keepassxc
  apk:
    # The musl build links libstdc++ dynamically; the glibc builds do not need it.
    depends:
      - openssh-client-default
      - libstdc++
