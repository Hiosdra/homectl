name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y openssh-client keepassxc
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: choco install keepassxc --yes --no-progress
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test --timeout 30000 tests/platform.test.ts tests/peer.test.ts tests/update.test.ts tests/dependencies.test.ts
      - name: Diagnose native SSH version process
        shell: pwsh
        run: |
          bun -e 'import {cleanEnv} from "./src/credentials"; import {executable} from "./src/platform"; for(const full of [false,true]) for(const stdin of ["ignore",new Blob([]),"inherit"]) {const p=Bun.spawn([executable("ssh"),"-V"],{env:full?process.env:cleanEnv(),stdin,stdout:"pipe",stderr:"pipe"});const [code,err]=await Promise.all([p.exited,new Response(p.stderr).text()]);console.log({full,input:typeof stdin==="string"?stdin:"empty-pipe",code,err})}'

      - name: PowerShell CLI smoke
        shell: pwsh
        run: |
          bun src/cli/main.ts setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun src/cli/main.ts setup --install-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains "$HOME\.local\bin") { throw 'Setup did not persist user PATH' }
          & "$HOME\.local\bin\homectl.cmd" help

      - name: CMD CLI smoke
        shell: cmd
        run: bun src/cli/main.ts help
      - name: Git Bash CLI smoke
        shell: bash
        run: bun src/cli/main.ts help
