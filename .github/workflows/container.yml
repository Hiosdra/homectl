name: Container image

# Builds the containerized peer image (Dockerfile). Pull requests only build.
# Pushing to GHCR happens only for a version tag (v*), with the GITHUB_TOKEN.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "schema/**"
      - "skills/**"
      - "docker/**"
      - "examples/container/**"
      - "scripts/container-smoke.sh"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Digest-pinned Bun base: oven/bun:1.4.5-debian (Bun 1.4.5, Debian variant), read
  # with `docker inspect` on 2026-11-20. The Dockerfile has no default on purpose.
  # Change this value only in a reviewed pull request.
  BUN_IMAGE: oven/bun@sha256:3dddea58e1f8f2240eca906b023fedb944f9a8352515a35309fd0c879fe00aaa
  IMAGE: ghcr.io/hiosdra/homectl

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # Build once into the local Docker engine and start it before anything is
      # pushed. The push step below reuses the same builder cache.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
          load: true
          push: false
          tags: homectl-smoke:ci

      # Runs the 0.3 default (broker + owner panel) and serve --container; both must become healthy.
      - name: Smoke test (default broker + panel, and serve --container)
        run: bash scripts/container-smoke.sh homectl-smoke:ci

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            BUN_IMAGE=${{ env.BUN_IMAGE }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
