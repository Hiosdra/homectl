name: Release

# Builds the release executables (see scripts/build-release.ts). A version tag (v*)
# also publishes a GitHub release with the archives and SHA256SUMS. A manual run
# builds and checks everything without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The same test tools as ci.yml: the session tests need keepassxc-cli and ssh-agent.
      - run: sudo apt-get update && sudo apt-get install -y zip openssh-client keepassxc

      - run: bun install --frozen-lockfile

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

      - run: bun scripts/build-release.ts

      # nfpm is pinned and its archive is checked against the official checksum before use.
      - name: Install nfpm 2.49.0
        run: |
          curl -sSfL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Linux_x86_64.tar.gz
          echo "2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - run: bun scripts/build-packages.ts
      - run: bun scripts/render-packaging.ts
      - name: Install the Linux packages in clean containers
        run: sh scripts/smoke-packages.sh dist

      - name: Smoke-test the linux-x64 executable
        run: |
          mkdir -p smoke
          tar -xzf dist/homectl-*-linux-x64.tar.gz -C smoke
          folder="$(ls -d smoke/homectl-*-linux-x64)"
          "${folder}/homectl" help
          status=0
          "${folder}/homectl" __internal bogus || status=$?
          test "$status" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # No checkout in this job, so gh needs the repository named explicitly.
        # Named files only: dist/packaging is a folder and gh release create takes files.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/*.deb dist/*.apk dist/SHA256SUMS \
            dist/packaging/homectl.rb dist/packaging/winget/*.yaml \
            --repo "$GITHUB_REPOSITORY" --title "homectl ${GITHUB_REF_NAME}" --generate-notes
